services:
  autotuneweb:
    build:
      context: ./AutotuneWeb
      dockerfile: Dockerfile
      network: host
    container_name: autotuneweb
    hostname: autotuneweb
    restart: unless-stopped
    ports:
      - "5000:80"
    networks:
      autotuneweb_containers:
    healthcheck:
      test: curl -v --fail http://localhost |grep Autotune || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  autotuneweb_containers:
    name: containers
    external: true
